# Builds the browsable guide with scripts/build-site.sh and publishes it
# to GitHub Pages: https://bonolo-health-cdu.github.io/bonolo-cdu-fhir-ig/
# Pull requests only build it, so a broken guide is caught before merge.
name: Publish guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install SUSHI and Jekyll
        run: |
          npm install -g fsh-sushi@3.20.1
          gem install jekyll --no-document
      - name: Build the guide
        run: ./scripts/build-site.sh
      - name: Fail on QA errors
        run: |
          python3 -c "import json,sys; q=json.load(open('site/qa.json')); print('QA errors:', q['errs'], 'warnings:', q['warnings'], 'broken links:', q['broken-links']); sys.exit(1 if q['errs'] or q['broken-links'] else 0)"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
