# ---------------------------------------------------------------
# SUSHI project configuration for the Bonolo Health CDU contract.
# SUSHI reads this file first. It tells SUSHI what the package is
# called, which FHIR version it targets, and where it will live.
# ---------------------------------------------------------------
id: ls.moh.bonolo.cdu
canonical: http://fhir.health.gov.ls/bonolo-cdu   # PLACEHOLDER - agree the real base URL with MoH ICT
name: BonoloCduIG
title: Bonolo Health CDU Prescription Exchange
status: draft
version: 0.3.0
fhirVersion: 4.0.1          # FHIR R4, what HAPI and OpenMRS fhir2 speak
copyrightYear: 2026+
releaseLabel: ci-build
publisher:
  name: Ministry of Health Lesotho / NUL Technical Team
# FSHOnly false: SUSHI also writes the ImplementationGuide resource,
# which the HL7 IG Publisher turns into a browsable website.
# scripts/build-site.sh builds it into site/ (not output/, which
# holds the pinned package). scripts/package.sh builds the package
# with FSHOnly: true, so website settings never change its contents.
FSHOnly: false
parameters:
  path-output: site

# Narrative pages, from input/pagecontent/. The Artifacts page
# (artifacts.html) is generated: one entry per profile, extension,
# code system, value set and example.
pages:
  index.md:
    title: Home
  exchange.md:
    title: Exchange workflow

menu:
  Home: index.html
  Exchange workflow: exchange.html
  Artifacts: artifacts.html
